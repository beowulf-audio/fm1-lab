# fm1-lab as a GitHub Action, for a firmware's repository:
#
#   - uses: beowulf-audio/fm1-lab@main
#     with:
#       command: run scenarios/smoke.yaml app/build/mysynth.fwsc --html report.html
#
# It installs bubblewrap (fm1-lab runs the emulator and builds sandboxed), builds the emulator (cached) and runs
# `fm1-lab COMMAND` in the repository. With toolchain: true it also builds the pi32v2-llvm compiler from source (1-2
# hours the first time, then cached) and fetches the SDK files, so `build` and `new` work.
name: fm1-lab
description: Headless test bench for M-VAVE FM-1 firmware (fm1-emu): run, compare, profile, brick-test, build
inputs:
  command:
    description: "fm1-lab's arguments, e.g. 'run scenarios/smoke.yaml app/build/x.fwsc' or 'brick-test dist/*.fwsc'"
    required: true
  toolchain:
    description: "true: also the compiler, SDK files and Python environment (for build, test, new)"
    default: "false"
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with: { node-version: 22 }
    - name: Sandbox
      shell: bash
      run: |
        sudo apt-get update -qq && sudo apt-get install -y -qq bubblewrap libasound2-dev libx11-dev libxkbcommon-dev libxcursor-dev libxrandr-dev libxi-dev pkg-config
        sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
    - shell: bash
      run: rustup toolchain install 1.95.0 --profile minimal
    - uses: actions/cache@v4
      with:
        path: |
          ${{ github.action_path }}/.work/target
          ~/.cargo/registry
        key: fm1-lab-emu-${{ runner.os }}-${{ hashFiles(format('{0}/vendor/fm1-emu/Cargo.lock', github.action_path)) }}
    - uses: actions/cache@v4
      if: inputs.toolchain == 'true'
      with:
        path: ${{ github.action_path }}/.work/toolchain/pi32v2-llvm-dropin-*
        key: fm1-lab-toolchain-${{ runner.os }}-${{ hashFiles(format('{0}/tools/setup-toolchain.sh', github.action_path), format('{0}/patches/toolchain/*', github.action_path)) }}
    - name: fm1-lab setup
      shell: bash
      run: |
        if [ "${{ inputs.toolchain }}" = "true" ]; then sudo apt-get install -y -qq ninja-build cmake; node "${{ github.action_path }}/bin/fm1-lab.mjs" setup
        else node "${{ github.action_path }}/bin/fm1-lab.mjs" setup emu; fi
    - name: fm1-lab ${{ inputs.command }}
      shell: bash
      run: node "${{ github.action_path }}/bin/fm1-lab.mjs" ${{ inputs.command }}
