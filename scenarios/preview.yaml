# A short tour for a preview of any firmware: the same inputs for every one (three keys together, a quick run of keys,
# PLAY, then PRESETS three times with a key each), its screen as a GIF and its sound. What the inputs do depends on the
# firmware: a synth plays a chord and a melody, a groovebox may play drums or program steps. So it shows the default
# state and the first presets, not everything a firmware can do; a tour written for the firmware does better.
name: preview
ms: 8500
click_ms: 150
steps:
  - { at: 1500, screenshot: boot }
  # three keys together (a chord on a synth), then a quick run of keys
  - { at: 1700, note: C4, vel: 100, hold: 600 }
  - { at: 1700, note: E4, vel: 100, hold: 600 }
  - { at: 1700, note: G4, vel: 100, hold: 600 }
  - { at: 2500, note: A4, vel: 110, hold: 150 }
  - { at: 2700, note: C5, vel: 110, hold: 150 }
  - { at: 2900, note: E5, vel: 110, hold: 150 }
  - { at: 3100, note: D5, vel: 110, hold: 300 }
  - { at: 3500, screenshot: played }
  # the sequencer, if it has one
  - { at: 3700, press: PLAY }
  - { at: 5200, screenshot: playing }
  - { at: 5300, press: PLAY }
  # a few presets, a note on each
  - { at: 5600, turn: PRESETS, clicks: 1 }
  - { at: 5800, note: C4, vel: 100, hold: 300 }
  - { at: 6300, turn: PRESETS, clicks: 1 }
  - { at: 6500, note: E4, vel: 100, hold: 300 }
  - { at: 7000, turn: PRESETS, clicks: 1 }
  - { at: 7200, note: G4, vel: 100, hold: 300 }
  - { at: 7800, screenshot: presets }
expect:
  boots: true
